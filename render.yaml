# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Interpres is a Node server, not a static site: the dictionary's lookups need
# one. GitHub Pages and Netlify's static hosting cannot run it.
#
# Two things here are not defaults and matter:
#
#   numInstances: 1 — the dictionary caches are held in memory.
#
#   Every key is `sync: false`, which means Render holds the value and this file
#   only names it. Nothing secret belongs in a file that is in a repository,
#   private or not.
services:
  - type: web
    name: interpres
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "20"

      # The dictionary's example sentences when no corpus has one. Nothing else
      # reaches a model: the conjugator, the decliner and the definitions all
      # work with no key at all.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
