<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Interpres">
  <!--
    A Roman temple and a translation mark in one drawing.
    
    The pediment is doubled: a second one of the same size sits behind and up to
    the right, offset the way the two panels of a translation logo overlap. That
    doubling is the whole reference — one roof is a building, two overlapping is
    a thing being carried from one place to another — and it costs one shape
    rather than the letters and arrows that turn to mush at sixteen pixels.

    No background plate. A square tile would read as a badge with a picture on
    it; the silhouette is the icon, so the pediment keeps its shape at the edge
    instead of losing it to a corner radius, and it sits on a light tab and a
    dark one alike.

    Three columns rather than four, and nothing narrower than five units in a
    64 box: at 16px a column is a pixel and a gap is a pixel, and a fourth turns
    the colonnade into a grey smear.
  -->
  <!-- The panel behind: a whole temple front, not a bare roof. Two triangles
       alone read as a mountain range, and a roof on a bar is a roof on a bar.
       It needs its own columns to read as the same building standing behind the
       first one. The front temple covers everything left of x=48, so the column
       and the step sit entirely in the strip that shows; drawn any wider they
       poke through the front entablature and read as a mistake rather than as
       a building standing behind. -->
  <g fill="#6ba4ff">
    <path d="M40 4 58 20 22 20Z"/>
    <rect x="21" y="22" width="38" height="6"/>
    <rect x="50" y="30" width="6" height="16"/>
    <rect x="46" y="46" width="13" height="6"/>
  </g>
  <g fill="#2f6fe4">
    <path d="M26 10 46 28 6 28Z"/>
    <rect x="5" y="30" width="42" height="6"/>
    <rect x="10.5" y="38" width="7" height="14"/>
    <rect x="22.5" y="38" width="7" height="14"/>
    <rect x="34.5" y="38" width="7" height="14"/>
    <rect x="4" y="54" width="44" height="6"/>
  </g>
</svg>
