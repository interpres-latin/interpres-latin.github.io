<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interpres</title>
  <meta name="description" content="Latin conjugation and declension tables, grammar reference pages, and a Latin dictionary with the Cambridge course vocabulary by stage." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Duolingo uses two in-house faces: Feather Bold for headings and DIN Round
    for everything else. Neither is free. Fredoka is the closest open match to
    Feather's chunky rounded letters and Nunito to DIN Round.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav__inner shell">
      <a class="nav__brand" href="/" data-link aria-label="Interpres, home">
        <img src="/assets/art/logo.svg" alt="" width="40" height="40" />
        <span class="nav__wordmark">interpres</span>
      </a>

      <!-- Duolingo's header: plain uppercase links on the right, grey, the
           current page a shade darker. No menu button at any width. -->
      <nav class="nav__links" aria-label="Pages">
        <a href="/conjugacion" data-link data-nav="conjugacion">Conjugations</a>
        <a href="/declinationes" data-link data-nav="declinationes">Declensions</a>
        <a href="/diccionario" data-link data-nav="diccionario">Dictionary</a>
        <a href="/grammatica" data-link data-nav="grammatica">Grammar</a>

    </div>

  <main id="main"></main>

  <footer class="footer">
    <div class="shell footer__inner">
      <span class="footer__brand">interpres</span>
      <a class="footer__link" href="https://github.com/yuzhe-chen/interpres" target="_blank" rel="noopener">GitHub</a>
      <p class="footer__legal">© Yuzhe (Julian) Chen 2026</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>

</html>
