<!doctype html>
<html lang="la">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interpres</title>
  <meta name="description" content="Latin ↔ English translator, full conjugation and declension tables, Whitaker's Words and a Latin tutor." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Runs before the first paint so the page never flashes the wrong palette.
    (function () {
      // The chrome is either Latin or English; the subject is always Latin.
      try {
        var l = localStorage.getItem('interpres:lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'la';
      } catch (e) { document.documentElement.lang = 'la'; }
      var stored = null;
      try { stored = localStorage.getItem('interpres:theme'); } catch (e) {}
      var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Ad contenta</a>

  <header class="nav" id="nav">
    <a class="nav__brand" href="/" data-link>
      <span class="nav__wordmark">Interpres</span>
    </a>
    <nav class="nav__links" aria-label="Index">
      <a href="/#interpres" data-link data-nav="traductor">Interpres</a>
      <a href="/conjugacion" data-link data-nav="conjugacion">Coniugatio</a>
      <a href="/declinationes" data-link data-nav="declinationes">Declinatio</a>
      <a href="/diccionario" data-link data-nav="diccionario">Lexicon</a>
      <a href="/chat" data-link data-nav="chat">Colloquium</a>
      <!--
        More tools are coming, and the header is the wrong place to grow one at
        a time. The menu is the shelf they go on; Stadia is what is on it now.
      -->
      <div class="navmore">
        <button class="navmore__button" type="button" aria-expanded="false" aria-haspopup="true"></button>
        <div class="navmore__list" role="menu" hidden>
          <a href="/stadia" data-link data-nav="stadia" role="menuitem">Stadia</a>
        </div>
      </div>
    </nav>
    <div class="langswitch" role="group"></div>
    <button class="nav__theme" type="button" aria-label="Mutare speciem"></button>
    <button class="nav__toggle" type="button" aria-label="Aperire indicem" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main id="main"></main>

  <footer class="footer">
    <p>Interpres · significationes ex <a href="https://mk270.github.io/whitakers-words/" target="_blank" rel="noopener">Whitaker’s Words</a></p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
